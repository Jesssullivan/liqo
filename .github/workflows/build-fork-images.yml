name: Build Fork Images

on:
  push:
    branches:
      - "sid/*"
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  # Force lowercase — Docker registries require it, github.repository_owner preserves case
  IMAGE_PREFIX: jesssullivan/liqo

jobs:
  configure:
    name: Configure build metadata
    runs-on: ubuntu-latest
    outputs:
      branch-slug: ${{ steps.meta.outputs.branch-slug }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      latest-tag: ${{ steps.meta.outputs.latest-tag }}
    steps:
      - name: Compute tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # For tags: use the tag name directly (e.g., v1.0.3)
            TAG="${GITHUB_REF#refs/tags/}"
            echo "branch-slug=${TAG}" >> "$GITHUB_OUTPUT"
            echo "short-sha=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "image-tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "latest-tag=latest" >> "$GITHUB_OUTPUT"
          else
            # For branches: slug the branch name and append short SHA
            BRANCH="${GITHUB_REF#refs/heads/}"
            SLUG="$(echo "$BRANCH" | sed 's|/|-|g')"
            SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
            echo "branch-slug=${SLUG}" >> "$GITHUB_OUTPUT"
            echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "image-tag=${SLUG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "latest-tag=latest-${SLUG}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image-name }}
    runs-on: ubuntu-latest
    needs: configure
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard components: cmd/<component> → liqo-<component> image
          - component: liqo-controller-manager
            cmd-path: ./cmd/liqo-controller-manager
            image-name: liqo-controller-manager
          - component: crd-replicator
            cmd-path: ./cmd/crd-replicator
            image-name: crd-replicator
          - component: fabric
            cmd-path: ./cmd/fabric
            image-name: fabric
          - component: gateway
            cmd-path: ./cmd/gateway
            image-name: gateway
          - component: ipam
            cmd-path: ./cmd/ipam
            image-name: ipam
          - component: proxy
            cmd-path: ./cmd/proxy
            image-name: proxy
          - component: webhook
            cmd-path: ./cmd/webhook
            image-name: webhook
          - component: virtual-kubelet
            cmd-path: ./cmd/virtual-kubelet
            image-name: virtual-kubelet
          - component: metric-agent
            cmd-path: ./cmd/metric-agent
            image-name: metric-agent
          - component: telemetry
            cmd-path: ./cmd/telemetry
            image-name: telemetry
          - component: uninstaller
            cmd-path: ./cmd/uninstaller
            image-name: uninstaller
          # Gateway sub-components: cmd/gateway/<sub> → gateway/<sub> image
          # These are separate binaries with wireguard/geneve-specific flags
          - component: wireguard
            cmd-path: ./cmd/gateway/wireguard
            image-name: gateway/wireguard
          - component: geneve
            cmd-path: ./cmd/gateway/geneve
            image-name: gateway/geneve
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build Go binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ./bin/amd64
          go build -ldflags="-s -w" \
            -o "./bin/amd64/${{ matrix.component }}_linux_amd64" \
            "${{ matrix.cmd-path }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image-name }}
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: build/liqo/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMPONENT=${{ matrix.component }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image-name }}:${{ needs.configure.outputs.image-tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image-name }}:${{ needs.configure.outputs.latest-tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image-name }}-ci:${{ needs.configure.outputs.image-tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image-name }}-ci:${{ needs.configure.outputs.latest-tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
